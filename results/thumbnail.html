<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Thumbnail</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { background: #14213D; color: #F7F5F0; font-family: "Segoe UI", Arial, sans-serif; display: flex; box-sizing: border-box; padding: 64px 72px 44px; gap: 48px; }
  .left { flex: 1.25; display: flex; flex-direction: column; }
  .right { flex: 1; display: flex; flex-direction: column; gap: 24px; justify-content: center; }
  .eyebrow { font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #F59E5B; }
  h1 { margin: 18px 0 0; font-size: 84px; line-height: 1.02; font-weight: 800; }
  .sub { margin-top: 26px; font-size: 32px; line-height: 1.3; color: #C9D3E3; }
  .spacer { flex: 1; }
  .foot { font-size: 22px; color: #8FA0BC; }
  .card { background: #F7F5F0; color: #14213D; border-radius: 20px; padding: 26px 30px; }
  .tag { display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: 2px; padding: 4px 14px; border-radius: 99px; color: #fff; }
  .ok .tag { background: #15803d; } .no .tag { background: #b42318; }
  .big { font-size: 50px; font-weight: 800; margin-top: 12px; line-height: 1.05; }
  .small { font-size: 24px; margin-top: 8px; color: #3D4756; white-space: nowrap; }
</style></head>
<body>
  <div class="left">
    <div class="eyebrow">AGENTIC CREDIT STRATEGY</div>
    <h1>An AI agent that knows when to say&nbsp;no</h1>
    <div class="sub">Grows approvals inside a locked risk appetite, then stops for a human.</div>
    <div class="spacer"></div>
    <div class="foot">Personal prototype · public Lending Club data</div>
  </div>
  <div class="right">
    <div class="card ok">
      <span class="tag">APPROVED TEST</span>
      <div class="big">+3.38% approvals</div>
      <div class="small">bad rate −0.075 pp · 79 seconds</div>
    </div>
    <div class="card no">
      <span class="tag">REFUSED</span>
      <div class="big">“Grow 15%”</div>
      <div class="small">names the limit · counter-offers</div>
    </div>
  </div>
</body></html>
