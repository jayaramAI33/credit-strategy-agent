# Field register: every column of the raw Lending Club file has exactly one role.
# tests/test_fields.py fails if a column is missing here or listed twice.

roles:
  primary_key: id
  dependent_source: loan_status      # -> bad flag (settings.yaml)
  vintage_source: issue_d            # -> issue quarter
  segment_id: term                   # portfolio split; v1 keeps 36-month only
  policy_axis: grade                 # used ONLY by the current policy, never a screened input
  formula_variable: null             # deferred by the user

