    - funded_amnt
    - funded_amnt_inv
    - pymnt_plan
    - out_prncp
    - out_prncp_inv
    - total_pymnt
    - total_pymnt_inv
    - total_rec_prncp
    - total_rec_int
    - total_rec_late_fee
    - recoveries
    - collection_recovery_fee
    - last_pymnt_d
    - last_pymnt_amnt
    - next_pymnt_d
    - last_credit_pull_d
    - last_fico_range_high
    - last_fico_range_low
    - hardship_flag
    - hardship_type
    - hardship_reason
    - hardship_status
    - deferral_term
    - hardship_amount
    - hardship_start_date
    - hardship_end_date
    - payment_plan_start_date
    - hardship_length
    - hardship_dpd
    - hardship_loan_status
    - orig_projected_additional_accrued_interest
    - hardship_payoff_balance_amount
    - hardship_last_payment_amount
    - debt_settlement_flag
    - debt_settlement_flag_date
    - settlement_status
    - settlement_date
    - settlement_amount
    - settlement_percentage
    - settlement_term
  lender_pricing_risk:     # Lending Club's own model and pricing
    - int_rate
    - installment
    - sub_grade
  proxy:                   # geographic proxies
    - zip_code
    - addr_state
  free_text_id:
    - member_id
    - url
    - desc
    - title
    - emp_title
  lender_operational:      # Lending Club process fields, not applicant information
    - initial_list_status
    - disbursement_method
    - policy_code

# Derived features (created after screening). A derived feature may use a
# screened-out source only if listed under allowed_rejected_sources, with a reason.
derived:
  fico_mid:
    from: [fico_range_low, fico_range_high]
    replaces: [fico_range_low, fico_range_high]
  loan_to_income:
    from: [loan_amnt, annual_inc]
  credit_age_months:
    from: [earliest_cr_line, issue_d]
  # ever_delinquent (from mths_since_last_delinq) was tried in phase 1 and dropped:
  # IV 0.000 on build, 0.003 on OOT.

# Variables the current policy already uses. Excluded from the top-N segment
# features, because segments are current-policy cells crossed with OTHER features.
policy_variables: [fico_mid, dti, loan_to_income]
